# Weekly dependency updates as pull requests; each one goes through CI like any other change.
#
# Major versions that move together are left to a deliberate upgrade instead of separate
# bot PRs that can't pass on their own: Node itself (.nvmrc, the Dockerfile's build image and
# @types/node change as one), and TypeScript (its majors wait for astro check and
# typescript-eslint to support them).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*node"
        update-types: ["version-update:semver-major"]
