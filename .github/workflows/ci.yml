name: CI

# The gate every change passes before it can reach main. Runs on pull requests,
# by hand (the Art workflow dispatches it for its manifest PR), and inside Deploy
# for the merged commit. The three job names are the required status checks on main.
#
# The image job saves the exact image it tested as the `image` artifact; Deploy and
# Preview push that artifact rather than rebuilding, so what ships is what passed.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Lint workflows and deploy scripts
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo mirror.gcr.io/rhysd/actionlint:1.7.12 -color
          shellcheck deploy/*.sh

  image:
    name: Container · Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Run the container and smoke-test it
        run: |
          docker run -d --name gallery -p 8080:8080 portfolio:ci
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          deploy/cloudrun.sh smoke http://localhost:8080

      - name: Lighthouse CI (mobile, every category ≥ 90)
        run: npx lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14

      - name: Save the tested image
        run: docker save portfolio:ci | gzip -1 > image.tar.gz

      - name: Upload the tested image
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar.gz
          retention-days: 3
          compression-level: 0
