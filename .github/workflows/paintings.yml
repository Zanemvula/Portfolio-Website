name: Paintings

# Generates paintings with the OpenAI Images API, converts them to AVIF/WebP,
# uploads them to gs://ntsikagqiba-assets/paintings/ and commits the updated
# content/paintings.json. Run it by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      keys:
        description: 'Space-separated keys (e.g. "chatly craft-cloud"). Empty = everything not yet published.'
        required: false
        default: ''
      force:
        description: Regenerate even if already published at this revision
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: paintings
  cancel-in-progress: false

jobs:
  paint:
    runs-on: ubuntu-latest
    if: ${{ vars.WIF_PROVIDER != '' && vars.WIF_SA != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAINTING_MODEL: ${{ vars.PAINTING_MODEL }}
          KEYS: ${{ inputs.keys }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          [ -n "$PAINTING_MODEL" ] || unset PAINTING_MODEL
          npx tsx scripts/generate-paintings.ts $KEYS $FORCE

      - name: Convert and upload
        env:
          KEYS: ${{ inputs.keys }}
        run: npx tsx scripts/process-paintings.ts $KEYS --upload

      - name: Commit the manifest
        id: commit
        run: |
          if git diff --quiet -- content/paintings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/paintings.json
          git commit -m "chore(paintings): publish ${{ inputs.keys || 'pending paintings' }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger workflows, so start the deploy explicitly.
      - name: Deploy the new paintings
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
