name: Deploy

# Production releases, from main only:
#   1. CI runs on the merged commit and saves the tested image.
#   2. That image is pushed to Artifact Registry and deployed as a new revision with
#      NO traffic, reachable only at its `candidate` tag URL.
#   3. The candidate is smoke-tested. A failure discards it; visitors never see it.
#   4. Traffic moves to the candidate in one step, and production is smoke-tested.
#      A failure there sends traffic straight back to the previous revision.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: europe-west1
  SERVICE: portfolio
  SITE_URL: https://ntsikagqiba.com

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release to Cloud Run
    needs: ci
    # Production is main only; the variables come from the GCP bootstrap (DEPLOY.md).
    if: ${{ github.ref == 'refs/heads/main' && vars.WIF_PROVIDER != '' && vars.WIF_SA != '' && vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    env:
      IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/portfolio/portfolio:${{ github.sha }}
      RUN_SA: ${{ vars.RUN_SA }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: image

      - name: Authenticate to Google Cloud (Workload Identity Federation, no keys)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Push the tested image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker load < image.tar.gz
          docker tag portfolio:ci "$IMAGE"
          docker push "$IMAGE"

      - name: Deploy the candidate (no traffic)
        id: candidate
        run: deploy/cloudrun.sh deploy "$IMAGE" "${COMMIT::7}-${GITHUB_RUN_ID}" candidate >> "$GITHUB_OUTPUT"

      - name: Smoke-test the candidate
        run: |
          echo "Candidate ${{ steps.candidate.outputs.revision }} at ${{ steps.candidate.outputs.url }}"
          deploy/cloudrun.sh smoke "${{ steps.candidate.outputs.url }}"

      - name: Discard a failed candidate
        if: failure() && steps.candidate.outputs.revision != ''
        run: deploy/cloudrun.sh discard "${{ steps.candidate.outputs.revision }}"

      - name: Promote
        id: promote
        run: |
          # Remember what is serving and what `previous` points at, to undo both if production fails.
          echo "previous=$(deploy/cloudrun.sh serving)" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$(deploy/cloudrun.sh tagged previous)" >> "$GITHUB_OUTPUT"
          deploy/cloudrun.sh promote "${{ steps.candidate.outputs.revision }}"

      - name: Smoke-test production
        id: production
        run: deploy/cloudrun.sh smoke "$(deploy/cloudrun.sh url)"

      - name: Roll back on a failed production check
        if: failure() && steps.production.outcome == 'failure' && steps.promote.outputs.previous != ''
        run: |
          echo "::error::Production smoke test failed; sending traffic back to ${{ steps.promote.outputs.previous }}"
          deploy/cloudrun.sh promote "${{ steps.promote.outputs.previous }}"
          # promote just tagged the failed revision `previous`; restore the tag to what it was.
          deploy/cloudrun.sh retag previous "${{ steps.promote.outputs.previous_tag }}"
          deploy/cloudrun.sh discard "${{ steps.candidate.outputs.revision }}"

      - name: Remove leftover previews
        # PR Cleanup can't delete a preview that was the newest revision when its PR closed;
        # now that this release is newer, it can go. Open PRs keep theirs (they are tagged).
        run: deploy/cloudrun.sh prune pr-

      - name: Check the public domain
        # DNS or certificate trouble is not a reason to roll back code, so this only warns.
        run: deploy/cloudrun.sh smoke "$SITE_URL" || echo "::warning::$SITE_URL failed its smoke test; the run.app URL passed."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release ${COMMIT::7}"
            echo "- Revision: \`${{ steps.candidate.outputs.revision }}\`"
            echo "- Previous: \`${{ steps.promote.outputs.previous }}\` (roll back with the **Rollback** workflow)"
            echo "- Site: $SITE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
