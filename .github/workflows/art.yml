name: Art

# Publishes the scene paintings. Default: take the PNGs you uploaded to
# gs://ntsikagqiba-assets/originals/<scene>/ (from ChatGPT), convert them to
# AVIF/WebP, upload them to gs://ntsikagqiba-assets/paintings/, and open a pull
# request with the updated content/paintings.json; merging it releases the art.
# Optionally paint missing scenes with the OpenAI API first. Run it by hand from
# the Actions tab.
on:
  workflow_dispatch:
    inputs:
      scenes:
        description: 'Space-separated scene keys (e.g. "hero chatly"). Empty = every scene with originals.'
        required: false
        default: ''
      generate:
        description: Paint scenes that have no originals with the OpenAI API first (needs the OPENAI_API_KEY secret)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  actions: write
  pull-requests: write

concurrency:
  group: art
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ vars.WIF_PROVIDER != '' && vars.WIF_SA != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Fetch originals
        run: |
          mkdir -p art
          if gcloud storage ls "gs://ntsikagqiba-assets/originals/" >/dev/null 2>&1; then
            gcloud storage cp -r "gs://ntsikagqiba-assets/originals/*" art/
          fi

      - name: Paint missing scenes with the API
        if: ${{ inputs.generate }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAINTING_MODEL: ${{ vars.PAINTING_MODEL }}
          CUTOUT_MODEL: ${{ vars.CUTOUT_MODEL }}
          SCENES: ${{ inputs.scenes }}
        run: |
          read -ra keys <<< "$SCENES"
          npx tsx scripts/art-generate.ts "${keys[@]}"

      - name: Convert and publish
        env:
          SCENES: ${{ inputs.scenes }}
        run: |
          read -ra keys <<< "$SCENES"
          npx tsx scripts/art-process.ts "${keys[@]}" --upload

      # main is protected, so the manifest goes through a pull request like any other change.
      # The paintings themselves are already public (immutable, revisioned names), and the
      # site only points at them once this PR is merged and released.
      - name: Open a pull request with the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          SCENES: ${{ inputs.scenes }}
        run: |
          if git diff --quiet -- content/paintings.json; then
            echo "The manifest is unchanged; nothing to merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="art/${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add content/paintings.json
          git commit -m "chore(art): publish ${SCENES:-scenes}"
          git push -u origin "$branch"
          # Pull requests opened with GITHUB_TOKEN don't trigger CI, so start it explicitly;
          # its checks then report on the PR's commit.
          gh workflow run ci.yml --ref "$branch"
          if url=$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
                --title "Publish art: ${SCENES:-scenes}" \
                --body "Paintings converted and uploaded to gs://ntsikagqiba-assets/paintings/ by the Art workflow. Merging releases them."); then
            echo "Manifest PR: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not open the PR. Allow it under Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or open one from $branch."
          fi
