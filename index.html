    <style>
      :root {
        --bg-color: #000000;
        --text-color: #ffffff;
        --accent-color: #0a0a0a;
        --border-color: rgba(255, 255, 255, 0.1);
        --muted-text: #71717a;
      }
      
      .light-theme {
        --bg-color: #ffffff;
        --text-color: #000000;
        --accent-color: #f4f4f5;
        --border-color: rgba(0, 0, 0, 0.1);
        --muted-text: #71717a;
      }

      body {
        font-family: 'JetBrains Mono', monospace;
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.4s ease, color 0.4s ease;
        margin: 0;
        line-height: 1.6;
      }

      /* Navigation padding offset */
      section {
        scroll-margin-top: 80px;
      }

      .selection-invert ::selection {
        background-color: var(--text-color);
        color: var(--bg-color);
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .terminal-cursor {
        display: inline-block;
        width: 8px;
        height: 1.2em;
        background-color: var(--text-color);
        animation: blink 1s step-end infinite;
        vertical-align: middle;
      }
      
      .btn-operator-glitch {
        position: relative;
        overflow: hidden;
        transition: all 0.2s ease;
      }
      .btn-operator-glitch:after {
        content: "EXECUTE_ORDER";
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: var(--text-color);
        color: var(--bg-color);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: left 0.3s cubic-bezier(0.86, 0, 0.07, 1);
        font-size: 10px;
        font-weight: 700;
      }
      .btn-operator-glitch:hover:after {
        left: 0;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-color);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--text-color);
        border-radius: 0;
      }

      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
